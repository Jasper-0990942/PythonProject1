<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5">
    <h2 class="text-center mb-4"> Luuk</h2>

    <div class="card mb-4">
        <div class="card-body">
            <form>
                <div class="mb-3">
                    <label for="voornaam" class="form-control">Voornaam</label>
                    <input type="text" id="voornaam" class="form-control" value="Luuk">
                </div>
                <div class="mb-3">
                    <label for="achternaam" class="form-label">Achternaam</label>
                    <input type="text" class="form-control" id="achternaam" value="De jong">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" value="0990941@hr.nl">
                </div>
                <button type="submit" class="btn btn-primary">Bewerken</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <p class="mb-2 fw-semibold">Door mij toegevoegde bronnen:</p>
            <div class="d-flex align-items-center justify-content-between">
                <span> Javascript cursus</span>
                <div>
                    <button class="btn btn-secondary btn-sm me-2">Bewerken</button>
                    <button class="btn btn-danger btn-sm">Verwijderen</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
